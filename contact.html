<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Mechanical Engineering Portfolio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- NAVIGATION -->

    <nav class="navbar">

        <a href="index.html">HOME</a>

        <a href="resume.pdf" target="_blank">
            RESUME
        </a>

        <a href="projects.html">
            PROJECTS
        </a>

        <a href="index.html#about">
            ABOUT
        </a>

        <a href="contact.html">
            CONTACT
        </a>

    </nav>


    <!-- CONTACT TITLE -->

    <header class="contact-header">

        <h1>CONTACT</h1>

    </header>


    <!-- CONTACT BOX -->

    <main class="contact-container">


        <!-- LEFT SIDE -->

        <section class="contact-form">

            <h2>Let's Talk!</h2>


            <form>

                <label for="name">
                    Your Name <span>*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <label for="email">
                    Email <span>*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="message">
                    Message <span>*</span>
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                ></textarea>


                <button type="submit">
                    SEND MESSAGE
                </button>

            </form>

        </section>



        <!-- RIGHT SIDE -->

        <section class="contact-info">

            <h2>Contact Info</h2>

            <p>
                <strong>Email:</strong><br>

                <a href="mailto:YOUR-EMAIL@gmail.com">
                    YOUR-EMAIL@gmail.com
                </a>
            </p>


            <p>
                <strong>LinkedIn:</strong><br>

                <a href="#" target="_blank">
                    LinkedIn Profile
                </a>
            </p>


            <p>
                <strong>GitHub:</strong><br>

                <a href="#" target="_blank">
                    GitHub Profile
                </a>
            </p>

        </section>


    </main>


</body>

</html>
